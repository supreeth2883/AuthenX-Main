<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthenX — College Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
body {
  background:
    radial-gradient(circle at 15% 10%, rgba(84, 105, 212, 0.12), transparent 28%),
    radial-gradient(circle at 85% 20%, rgba(13, 185, 104, 0.09), transparent 26%),
    var(--ax-bg);
  min-height: 100vh;
}

.login-wrap {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.login-container {
  width: min(520px, 100%);
  background: var(--ax-card);
  border: 1px solid var(--ax-border);
  border-radius: var(--ax-radius-lg);
  box-shadow: 0 12px 30px rgba(26, 31, 54, 0.08), 0 2px 8px rgba(26, 31, 54, 0.05);
  padding: 32px;
}

.logo-area { text-align: center; margin-bottom: 28px; }

.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px;
  background: linear-gradient(135deg, var(--ax-accent) 0%, #6b7deb 100%);
  border-radius: 12px;
  color: #fff; font-weight: 800; font-size: 18px;
  margin-bottom: 12px;
  box-shadow: 0 6px 16px rgba(84, 105, 212, 0.28);
}

.logo-area h1 { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; color: var(--ax-text); letter-spacing: -0.4px; }
.logo-area p  { font-size: 13px; color: var(--ax-muted); margin-top: 4px; }

.portal-badge {
  display: inline-block;
  background: var(--ax-sky);
  color: var(--ax-accent);
  font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 999px;
  border: 1px solid rgba(84,105,212,0.25);
  margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px;
}

.divider { border: none; border-top: 1px solid var(--ax-border); margin: 20px 0; }

.form-group { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 700; color: var(--ax-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.7px; }

input {
  width: 100%;
  padding: 11px 13px;
  background: #fff;
  border: 1.5px solid var(--ax-border);
  border-radius: 8px;
  font-size: 14px;
  color: var(--ax-text);
  transition: border-color .15s ease, box-shadow .15s ease;
  font-family: inherit;
}
input:focus { outline: none; border-color: var(--ax-accent); box-shadow: 0 0 0 3px rgba(84,105,212,.12); }
input::placeholder { color: var(--ax-subtle); }

.demo-hint {
  background: #f9fbff;
  border: 1px solid var(--ax-border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--ax-muted);
}
.demo-hint strong { color: var(--ax-text); display: block; margin-bottom: 6px; }
.demo-cred { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--ax-border); }
.demo-cred:last-child { border-bottom: none; }
.demo-fill { cursor:pointer; color:var(--ax-accent); font-weight:600; }

.btn-login {
  width: 100%;
  padding: 11px;
  background: var(--ax-accent);
  color: #fff;
  border: 1px solid var(--ax-accent);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s ease, box-shadow .15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 1px 4px rgba(84,105,212,0.32);
}
.btn-login:hover { background: var(--ax-accent-h); border-color: var(--ax-accent-h); }
.btn-login:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; }

.error-box {
  background: var(--ax-revoked-bg);
  border: 1px solid #f5a9b8;
  border-radius: 8px;
  padding: 10px 12px;
  color: #c0132e;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 20px; display: none;
}

.spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.25); border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

.footer-links { text-align: center; margin-top: 18px; font-size: 13px; color: var(--ax-muted); }
.footer-links a { color: var(--ax-accent); text-decoration: none; font-weight: 600; transition: color .15s; }
.footer-links a:hover { color: var(--ax-accent-h); }

@media (max-width: 560px) {
  .login-container { padding: 24px 18px; }
}
</style>
</head>
<body>
<div class="login-wrap">
<div class="login-container">
  <div class="logo-area">
    <div class="logo-mark">AX</div>
    <h1>AuthenX</h1>
    <p>Academic Credential Infrastructure</p>
    <div class="portal-badge">College Admin Portal</div>
  </div>

  <div class="demo-hint">
    <strong>Demo Credentials</strong>
    <div class="demo-cred">
      <span>Super Login (Offline + Online)</span>
      <span onclick="fillCred('superadmin@authenx.in','1234')" class="demo-fill">Fill</span>
    </div>
  </div>

  <hr class="divider">

  <div class="error-box" id="error-box"></div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="admin@iitb.ac.in" autocomplete="email">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
  </div>

  <button class="btn-login" id="login-btn" onclick="doLogin()">
    Sign In to Portal
  </button>

  <div class="footer-links">
    <p>Employer? <a href="../employer/index.html">Go to Verify Portal →</a></p>
  </div>
</div>
</div>

<script src="../shared/offline-auth.js"></script>
<script>
const API_CANDIDATES = [
  localStorage.getItem('authenx_api_base'),
  'http://127.0.0.1:3001',
  'http://localhost:3001',
  'http://127.0.0.1:3002',
  'http://localhost:3002',
  'http://127.0.0.1:3100',
  'http://localhost:3100',
  'http://127.0.0.1:3200',
  'http://localhost:3200',
  'http://127.0.0.1:3300',
  'http://localhost:3300',
  'http://127.0.0.1:3000',
  'http://localhost:3000',
].filter((v, i, arr) => v && arr.indexOf(v) === i);

let API = API_CANDIDATES[0] || 'http://127.0.0.1:3001';
let apiBasePromise = null;

async function getApiBase() {
  if (apiBasePromise) return apiBasePromise;

  apiBasePromise = (async () => {
    for (const base of API_CANDIDATES) {
      try {
        const r = await fetch(`${base}/health`);
        const text = await r.text();
        let data = null;
        try { data = JSON.parse(text); } catch {}

        if (r.ok && data && data.status === 'ok') {
          API = base;
          localStorage.setItem('authenx_api_base', API);
          return API;
        }
      } catch {}
    }
    return API;
  })();

  return apiBasePromise;
}

function fillCred(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Keep login page visible when opened directly (e.g., Live Preview).
// Previous behavior auto-redirected immediately if a token existed in localStorage.

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  const errBox   = document.getElementById('error-box');

  if (!email || !password) {
    showError('Please enter email and password.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in...';
  errBox.style.display = 'none';

  const offline = window.AuthenXOfflineAuth?.loginWithSuperCredential(email, password, {
    role: 'college_admin',
    collegeId: 'clg_demo_1'
  });
  if (offline) {
    localStorage.setItem('ax_token', offline.token);
    localStorage.setItem('ax_user', JSON.stringify(offline.user));
    localStorage.setItem('ax_onboarded', '1');
    localStorage.setItem('ax_connector_url', 'http://localhost:9001');
    window.location.href = 'dashboard.html';
    return;
  }

  try {
    const apiBase = await getApiBase();
    const res = await fetch(`${apiBase}/v1/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Login failed');

    localStorage.setItem('ax_token', data.token);
    localStorage.setItem('ax_user', JSON.stringify(data.user || {}));
    localStorage.setItem('ax_onboarded', '0');

    // Check backend: if onboarding is already complete, go straight to dashboard.
    try {
      const cfgRes = await fetch(`${apiBase}/v1/connector-config`, {
        headers: { 'Authorization': `Bearer ${data.token}`, 'Content-Type': 'application/json' }
      });
      if (cfgRes.ok) {
        const cfg = await cfgRes.json();
        if (cfg.onboarding_completed) {
          localStorage.setItem('ax_onboarded', '1');
          window.location.href = 'dashboard.html';
          return;
        }
      }
    } catch {}

    window.location.href = 'onboarding.html';
  } catch (err) {
    showError(err.message || 'Invalid credentials. Please try again.');
    btn.disabled = false;
    btn.innerHTML = 'Sign In to Portal';
  }
}

function showError(msg) {
  const errBox = document.getElementById('error-box');
  errBox.textContent = msg;
  errBox.style.display = 'block';
}
</script>
</body>
</html>
