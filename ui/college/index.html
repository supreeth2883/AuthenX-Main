<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthenX — College Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background-color: #020617;
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(29, 78, 216, 0.15), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.login-container {
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 48px;
  width: 440px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.logo-area { text-align: center; margin-bottom: 36px; }

.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 56px; height: 56px;
  background: linear-gradient(135deg, #3b82f6 0%, rgba(16,185,129,0.8) 100%);
  border-radius: 16px;
  color: white; font-weight: 800; font-size: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
}

.logo-area h1 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 700; color: white; letter-spacing: -0.5px; }
.logo-area p  { font-size: 14px; color: #94a3b8; margin-top: 6px; }

.portal-badge {
  display: inline-block;
  background: rgba(59, 130, 246, 0.15);
  color: #60a5fa;
  font-size: 11px; font-weight: 600;
  padding: 4px 12px; border-radius: 999px;
  border: 1px solid rgba(59, 130, 246, 0.3);
  margin-top: 12px; text-transform: uppercase; letter-spacing: 0.5px;
}

.divider { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 24px 0; }

.form-group { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

input {
  width: 100%; padding: 14px 16px;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  font-size: 15px; color: white;
  transition: all 0.2s ease;
  font-family: inherit;
}
input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.15); background: rgba(0,0,0,0.4); }
input::placeholder { color: #64748b; }

.demo-hint {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 16px;
  margin-bottom: 24px; font-size: 13px; color: #94a3b8;
}
.demo-hint strong { color: white; display: block; margin-bottom: 8px;}
.demo-cred { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.demo-cred:last-child { border-bottom: none; }

.btn-login {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); filter: brightness(1.1); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.error-box {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 12px; padding: 12px 16px;
  color: #f87171; font-size: 13px; font-weight: 500;
  margin-bottom: 20px; display: none;
}

.spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.2); border-top-color:white; border-radius:50%; animation:spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

.footer-links { text-align: center; margin-top: 28px; font-size: 13px; color: #94A3B8; }
.footer-links a { color: #60a5fa; text-decoration: none; font-weight: 500; transition: color 0.2s; }
.footer-links a:hover { color: white; }
</style>
</head>
<body>
<div class="login-container">
  <div class="logo-area">
    <div class="logo-mark">AX</div>
    <h1>AuthenX</h1>
    <p>Academic Credential Infrastructure</p>
    <div class="portal-badge">College Admin Portal</div>
  </div>

  <div class="demo-hint">
    <strong>Demo Credentials</strong>
    <div class="demo-cred">
      <span>IIT Bombay Admin</span>
      <span onclick="fillCred('iitb@authenx.in','College@123')" style="cursor:pointer;color:#3B82F6">Fill ↗</span>
    </div>
    <div class="demo-cred">
      <span>Super Admin</span>
      <span onclick="fillCred('admin@authenx.in','Admin@123')" style="cursor:pointer;color:#3B82F6">Fill ↗</span>
    </div>
  </div>

  <hr class="divider">

  <div class="error-box" id="error-box"></div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="admin@iitb.ac.in" autocomplete="email">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
  </div>

  <button class="btn-login" id="login-btn" onclick="doLogin()">
    Sign In to Portal
  </button>

  <div class="footer-links">
    <p>Employer? <a href="/employer/index.html">Go to Verify Portal →</a></p>
  </div>
</div>

<script>
function fillCred(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Auto-redirect if already logged in
(function() {
  const t = localStorage.getItem('ax_token');
  if (t) {
    try {
      const c = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (c.exp > Date.now()/1000) window.location.href = '/college/dashboard.html';
    } catch {}
  }
})();

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  const errBox   = document.getElementById('error-box');

  if (!email || !password) {
    showError('Please enter email and password.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in...';
  errBox.style.display = 'none';

  try {
    const res = await fetch('http://localhost:3000/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Login failed');

    localStorage.setItem('ax_token', data.token);
    localStorage.setItem('ax_user', JSON.stringify({ email: data.email, role: data.role }));

    window.location.href = '/college/dashboard.html';
  } catch (err) {
    showError(err.message || 'Invalid credentials. Please try again.');
    btn.disabled = false;
    btn.innerHTML = 'Sign In to Portal';
  }
}

function showError(msg) {
  const errBox = document.getElementById('error-box');
  errBox.textContent = msg;
  errBox.style.display = 'block';
}
</script>
</body>
</html>
