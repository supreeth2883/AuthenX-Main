<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthenX — Manage Tokens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/college/app.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <h2>Manage Tokens</h2>
        <p>View and revoke issued credentials</p>
      </div>
      <div class="topbar-actions">
        <div class="connector-status" id="connector-status"><div class="pulse-dot"></div> Checking...</div>
        <a href="/college/issue.html" class="btn btn-primary">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Issue New
        </a>
      </div>
    </header>

    <main class="page-content">
      <!-- Filter bar -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="search-input" placeholder="Search by student ref or token ID…" oninput="filterTokens()">
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">All</button>
          <button class="filter-tab" data-filter="active" onclick="setFilter('active',this)">Active</button>
          <button class="filter-tab" data-filter="revoked" onclick="setFilter('revoked',this)">Revoked</button>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Token ID</th>
              <th>Student Ref</th>
              <th>Credential Type</th>
              <th>Issued At</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tokens-tbody">
            <tr><td colspan="6" style="text-align:center;padding:48px">
              <div class="spinner spinner-blue" style="margin:0 auto 12px"></div>
              Loading tokens…
            </td></tr>
          </tbody>
        </table>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--ax-gray-400)" id="count-label"></div>
    </main>
  </div>
</div>

<script src="/college/app.js"></script>
<script>
if (!Auth.requireAuth()) {}
document.getElementById('sidebar-mount').innerHTML = renderSidebar('tokens');
initNav('tokens');

let allTokens = [];
let currentFilter = 'all';

async function loadTokens() {
  try {
    const data = await API.get('/tokens');
    allTokens = data.tokens || [];
    renderTable(allTokens);
  } catch (err) {
    document.getElementById('tokens-tbody').innerHTML =
      `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--ax-gray-400)">Error: ${err.message}</td></tr>`;
    toast('Failed to load tokens: ' + err.message, 'error');
  }
}

function filterTokens() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let filtered = allTokens;
  if (currentFilter !== 'all') filtered = filtered.filter(t => t.status === currentFilter);
  if (q) filtered = filtered.filter(t =>
    (t.id||'').toLowerCase().includes(q) ||
    (t.student_ref_token||'').toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  filterTokens();
}

function renderTable(tokens) {
  document.getElementById('count-label').textContent = `Showing ${tokens.length} token${tokens.length !== 1 ? 's' : ''}`;
  const tbody = document.getElementById('tokens-tbody');

  if (!tokens.length) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">
      <h3>No tokens found</h3>
      <p>${currentFilter !== 'all' ? 'No ' + currentFilter + ' tokens.' : 'No credentials issued yet.'}</p>
      <a href="/college/issue.html" class="btn btn-primary">Issue First Credential</a>
    </div></td></tr>`;
    return;
  }

  tbody.innerHTML = tokens.map(t => {
    const isRevoked = t.status === 'revoked';
    const rowStyle = isRevoked ? 'opacity:0.7' : '';
    const nameStyle = isRevoked ? 'text-decoration:line-through;color:var(--ax-gray-400)' : '';
    return `
      <tr style="${rowStyle}">
        <td>
          <div style="font-family:monospace;font-size:11px;color:var(--ax-gray-500)">${(t.id||'').slice(0,8)}…</div>
        </td>
        <td>
          <div style="font-family:monospace;font-size:12px;font-weight:600;color:var(--ax-gray-900);${nameStyle}">${t.student_ref_token||'—'}</div>
        </td>
        <td><span style="font-size:12px">${(t.credential_type||'—').replace(/_/g,' ')}</span></td>
        <td style="font-size:12px">${formatDate(t.issued_at)}</td>
        <td>
          ${statusBadge(t.status)}
          ${isRevoked && t.revocation_reason ? `<div style="font-size:11px;color:var(--ax-gray-400);margin-top:3px">${t.revocation_reason}</div>` : ''}
        </td>
        <td>
          ${isRevoked
            ? '<span style="font-size:12px;color:var(--ax-gray-400)">—</span>'
            : `<button class="btn btn-danger btn-sm" onclick="revokeToken('${t.id}','${t.student_ref_token}')">Revoke</button>`
          }
        </td>
      </tr>`;
  }).join('');
}

function revokeToken(tokenId, ref) {
  let reasonValue = '';
  showModal({
    title: 'Revoke Credential',
    body: `
      <p>You are about to permanently revoke the credential for <strong>${ref}</strong>.</p>
      <p style="margin-top:8px;padding:10px;background:var(--ax-revoked-bg);border-radius:6px;color:var(--ax-revoked);font-size:13px">
        ⚠ This action cannot be undone. Any future verification of this code will immediately fail.
      </p>
      <div style="margin-top:16px">
        <label style="font-size:13px;font-weight:500;color:var(--ax-gray-700)">Reason for Revocation <span style="color:var(--ax-revoked)">*</span></label>
        <input type="text" id="revoke-reason-input" placeholder="e.g. Student withdrew, Error in data…"
               style="margin-top:6px;width:100%;padding:10px 14px;border:1px solid var(--ax-gray-200);border-radius:8px;font-size:14px">
      </div>`,
    confirmText: 'Revoke Permanently',
    confirmClass: 'btn-danger',
    onConfirm: async () => {
      const reason = document.getElementById('revoke-reason-input')?.value?.trim() || 'Revoked by admin';
      try {
        await API.post('/tokens/revoke', { token_id: tokenId, reason });
        toast(`✓ Credential for ${ref} has been revoked`, 'success');
        loadTokens();
      } catch (err) {
        toast('Revoke failed: ' + err.message, 'error');
      }
    }
  });
}

loadTokens();
</script>
</body>
</html>
