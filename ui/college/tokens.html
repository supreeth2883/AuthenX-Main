<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthenX — Manage Tokens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h2>Manage Tokens</h2>
          <p>Full credential lifecycle — issue, revoke, correct, and track</p>
        </div>
        <div class="topbar-actions">
          <div class="connector-status" id="connector-status">
            <div class="pulse-dot"></div> Checking...
          </div>
          <a href="/college/issue.html" class="btn btn-primary">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Issue New
          </a>
        </div>
      </header>

      <main class="page-content">
        <!-- Filter bar -->
        <div class="search-bar">
          <div class="search-input-wrap">
            <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="search-input" placeholder="Search by student ref or token ID…"
              oninput="filterTokens()">
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">All</button>
            <button class="filter-tab" data-filter="active" onclick="setFilter('active',this)">Active</button>
            <button class="filter-tab" data-filter="revoked" onclick="setFilter('revoked',this)">Revoked</button>
            <button class="filter-tab" data-filter="superseded"
              onclick="setFilter('superseded',this)">Superseded</button>
            <button class="filter-tab" data-filter="corrected" onclick="setFilter('corrected',this)">Corrected</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Token ID</th>
                <th>Student Ref</th>
                <th>Type</th>
                <th>Issued At</th>
                <th>Last Verified</th>
                <th>Verifications</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tokens-tbody">
              <tr>
                <td colspan="8" style="text-align:center;padding:48px">
                  <div class="spinner spinner-blue" style="margin:0 auto 12px"></div>
                  Loading tokens…
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Token details panel (shown below table on row click) -->
        <div id="token-details-panel" class="token-details-panel">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 style="font-size:14px;font-weight:600;color:var(--ax-text)">Token Details</h3>
            <button class="btn btn-ghost btn-sm" onclick="closeDetails()">✕ Close</button>
          </div>
          <div id="token-details-content"></div>
        </div>

        <div style="margin-top:12px;font-size:12px;color:var(--ax-subtle)" id="count-label"></div>
      </main>
    </div>
  </div>

  <script src="/college/app.js"></script>
  <script>
    if (!Auth.requireAuth()) { }
    document.getElementById('sidebar-mount').innerHTML = renderSidebar('tokens');
    initNav('tokens');

    let allTokens = [];
    let currentFilter = 'all';
    let expandedTokenId = null;

    async function loadTokens() {
      try {
        const data = await API.get('/tokens');
        allTokens = data.tokens || [];
        renderTable(allTokens);
      } catch (err) {
        document.getElementById('tokens-tbody').innerHTML =
          `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--ax-subtle)">Error: ${err.message}</td></tr>`;
        toast('Failed to load tokens: ' + err.message, 'error');
      }
    }

    function filterTokens() {
      const q = document.getElementById('search-input').value.toLowerCase();
      let filtered = allTokens;
      if (currentFilter !== 'all') filtered = filtered.filter(t => t.status === currentFilter);
      if (q) filtered = filtered.filter(t =>
        (t.id || '').toLowerCase().includes(q) ||
        (t.student_ref_token || '').toLowerCase().includes(q)
      );
      renderTable(filtered);
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      filterTokens();
    }

    function lifecycleBadge(status) {
      const map = {
        active: `<span class="lifecycle-badge lifecycle-active">● Active</span>`,
        revoked: `<span class="lifecycle-badge lifecycle-revoked">✕ Revoked</span>`,
        superseded: `<span class="lifecycle-badge lifecycle-superseded">↩ Superseded</span>`,
        corrected: `<span class="lifecycle-badge lifecycle-corrected">✎ Corrected</span>`,
      };
      return map[status] || `<span class="lifecycle-badge">${status}</span>`;
    }

    function renderTable(tokens) {
      document.getElementById('count-label').textContent = `Showing ${tokens.length} token${tokens.length !== 1 ? 's' : ''}`;
      const tbody = document.getElementById('tokens-tbody');

      if (!tokens.length) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">
      <h3>No tokens found</h3>
      <p>${currentFilter !== 'all' ? 'No ' + currentFilter + ' tokens.' : 'No credentials issued yet.'}</p>
      <a href="/college/issue.html" class="btn btn-primary">Issue First Credential</a>
    </div></td></tr>`;
        return;
      }

      tbody.innerHTML = tokens.map(t => {
        const faded = ['revoked', 'superseded'].includes(t.status) ? 'opacity:0.75' : '';
        const strike = ['revoked', 'superseded'].includes(t.status) ? 'text-decoration:line-through;color:var(--ax-subtle)' : '';
        const canAct = t.status === 'active';
        return `
      <tr style="${faded};cursor:pointer" onclick="toggleDetails('${t.id}')">
        <td>
          <div style="font-family:monospace;font-size:11px;color:var(--ax-muted)">${(t.id || '').slice(0, 8)}…</div>
        </td>
        <td>
          <div style="font-family:monospace;font-size:12px;font-weight:600;color:var(--ax-text);${strike}">${t.student_ref_token || '—'}</div>
        </td>
        <td><span style="font-size:12px">${(t.credential_type || '—').replace(/_/g, ' ')}</span></td>
        <td style="font-size:12px">${formatDate(t.issued_at)}</td>
        <td style="font-size:12px">${t.last_verified_at ? formatDate(t.last_verified_at) : '<span style="color:var(--ax-subtle)">Never</span>'}</td>
        <td style="font-size:13px;font-weight:600;color:var(--ax-text)">${t.verification_count || 0}</td>
        <td>
          ${lifecycleBadge(t.status)}
          ${t.revocation_reason ? `<div style="font-size:11px;color:var(--ax-subtle);margin-top:3px">${t.revocation_reason.slice(0, 40)}…</div>` : ''}
        </td>
        <td onclick="event.stopPropagation()">
          ${canAct ? `
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-danger btn-sm" onclick="revokeToken('${t.id}','${t.student_ref_token}')">Revoke</button>
              <button class="btn btn-secondary btn-sm" onclick="correctToken('${t.id}','${t.student_ref_token}')">Reissue</button>
            </div>
          ` : '<span style="font-size:12px;color:var(--ax-subtle)">—</span>'}
        </td>
      </tr>`;
      }).join('');
    }

    async function toggleDetails(tokenId) {
      const panel = document.getElementById('token-details-panel');
      if (expandedTokenId === tokenId) {
        closeDetails();
        return;
      }
      expandedTokenId = tokenId;
      panel.classList.add('open');
      document.getElementById('token-details-content').innerHTML = `
    <div style="text-align:center;padding:24px"><div class="spinner spinner-blue" style="margin:0 auto"></div></div>`;

      try {
        const data = await API.get(`/tokens/${tokenId}/details`);
        const t = data.token;
        document.getElementById('token-details-content').innerHTML = `
      <div class="detail-grid">
        <div class="detail-item"><label>Token ID</label><value>${t.id}</value></div>
        <div class="detail-item"><label>College</label><value>${t.college_name} (${t.short_code})</value></div>
        <div class="detail-item"><label>Status</label><value>${lifecycleBadge(t.status)}</value></div>
        <div class="detail-item"><label>Credential Type</label><value>${(t.credential_type || '—').replace(/_/g, ' ')}</value></div>
        <div class="detail-item"><label>Issued At</label><value>${formatDate(t.issued_at)}</value></div>
        <div class="detail-item"><label>Verification Count</label><value>${t.verification_count || 0}</value></div>
        <div class="detail-item"><label>Last Verified</label><value>${t.last_verified_at ? formatDate(t.last_verified_at) : 'Never'}</value></div>
        <div class="detail-item"><label>Last Result</label><value>${t.last_result || '—'}</value></div>
        <div class="detail-item"><label>Canonical Hash</label><value>${(t.canonical_hash || '').slice(0, 32)}…</value></div>
        <div class="detail-item"><label>Schema Version</label><value>${t.schema_version}</value></div>
        ${t.revocation_reason ? `<div class="detail-item"><label>Revocation Reason</label><value>${t.revocation_reason}</value></div>` : ''}
        ${t.superseded_by ? `<div class="detail-item"><label>Superseded By</label><value>${t.superseded_by.slice(0, 16)}…</value></div>` : ''}
        ${t.correction_token_id ? `<div class="detail-item"><label>Corrects Token</label><value>${t.correction_token_id.slice(0, 16)}…</value></div>` : ''}
      </div>`;
      } catch (err) {
        document.getElementById('token-details-content').innerHTML =
          `<p style="color:var(--ax-revoked);font-size:13px">Failed to load details: ${err.message}</p>`;
      }
    }

    function closeDetails() {
      expandedTokenId = null;
      const panel = document.getElementById('token-details-panel');
      panel.classList.remove('open');
    }

    function revokeToken(tokenId, ref) {
      showModal({
        title: 'Revoke Credential',
        body: `
      <p>Permanently revoke credential for <strong>${ref}</strong>.</p>
      <p style="margin-top:8px;padding:10px;background:var(--ax-revoked-bg);border-radius:6px;color:var(--ax-revoked);font-size:13px">
        ⚠ This cannot be undone. Future verifications will fail.
      </p>
      <div style="margin-top:16px">
        <label style="font-size:13px;font-weight:500;color:var(--ax-text)">Reason <span style="color:var(--ax-revoked)">*</span></label>
        <select class="reason-select" id="revoke-reason-select" onchange="toggleCustomReason()">
          <option value="Student withdrew">Student withdrew</option>
          <option value="Data error">Data error</option>
          <option value="Credential voided">Credential voided</option>
          <option value="__custom">Custom reason…</option>
        </select>
        <input type="text" id="revoke-reason-custom" placeholder="Enter custom reason…"
               style="display:none;margin-top:8px;width:100%;padding:10px 14px;background:var(--ax-bg);border:1px solid var(--ax-border);border-radius:8px;color:var(--ax-text);font-size:14px">
      </div>`,
        confirmText: 'Revoke Permanently',
        confirmClass: 'btn-danger',
        onConfirm: async () => {
          const sel = document.getElementById('revoke-reason-select')?.value;
          const custom = document.getElementById('revoke-reason-custom')?.value?.trim();
          const reason = sel === '__custom' ? (custom || 'Custom reason') : sel;
          try {
            await API.post('/tokens/revoke', { token_id: tokenId, reason });
            toast(`✓ Credential for ${ref} has been revoked`, 'success');
            loadTokens();
          } catch (err) {
            toast('Revoke failed: ' + err.message, 'error');
          }
        }
      });
    }

    function toggleCustomReason() {
      const sel = document.getElementById('revoke-reason-select');
      const custom = document.getElementById('revoke-reason-custom');
      if (sel && custom) custom.style.display = sel.value === '__custom' ? 'block' : 'none';
    }

    function correctToken(tokenId, ref) {
      showModal({
        title: 'Reissue (Correction)',
        body: `
      <p>Create a <strong>correction token</strong> for <strong>${ref}</strong>.</p>
      <div style="margin-top:10px;padding:12px;background:var(--ax-sky);border-radius:8px;font-size:13px">
        <strong>What happens:</strong>
        <ul style="margin:6px 0 0 16px;line-height:1.7">
          <li>Current token is marked <strong>Superseded</strong></li>
          <li>A new token is created with the same student reference</li>
          <li>Both tokens remain in the audit trail</li>
          <li>You should re-issue a new credential via the Issue page after this</li>
        </ul>
      </div>
      <div style="margin-top:16px">
        <label style="font-size:13px;font-weight:500;color:var(--ax-text)">Correction Reason <span style="color:var(--ax-revoked)">*</span></label>
        <input type="text" id="correct-reason-input" placeholder="e.g. CGPA updated, typo in name…"
               style="margin-top:6px;width:100%;padding:10px 14px;background:var(--ax-bg);border:1px solid var(--ax-border);border-radius:8px;color:var(--ax-text);font-size:14px">
      </div>`,
        confirmText: 'Create Correction',
        confirmClass: 'btn-primary',
        onConfirm: async () => {
          const reason = document.getElementById('correct-reason-input')?.value?.trim();
          if (!reason) { toast('Please enter a correction reason', 'error'); return; }
          try {
            const result = await API.post('/tokens/correct', { token_id: tokenId, reason });
            toast(`✓ Correction created. New token: ${result.new_token_id.slice(0, 8)}…`, 'success');
            loadTokens();
          } catch (err) {
            toast('Correction failed: ' + err.message, 'error');
          }
        }
      });
    }

    loadTokens();
  </script>
</body>

</html>
