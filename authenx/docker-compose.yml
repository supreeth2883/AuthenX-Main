version: "3.9"

# AuthenX Local Development Stack
# Run: docker-compose up -d
# This starts PostgreSQL and creates the authenx database automatically.

services:

  # ─────────────────────────────────────────
  # PostgreSQL — Primary Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: authenx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authenx
      POSTGRES_PASSWORD: authenx_dev_password
      POSTGRES_DB: authenx_db
    ports:
      - "5432:5432"
    volumes:
      - authenx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authenx -d authenx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis — Session Store + Rate Limiting
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: authenx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - authenx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # pgAdmin — Optional DB Browser (dev only)
  # Access at: http://localhost:5050
  # Login: admin@authenx.dev / admin
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: authenx-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@authenx.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools  # Only starts with: docker-compose --profile tools up

volumes:
  authenx_postgres_data:
  authenx_redis_data:
